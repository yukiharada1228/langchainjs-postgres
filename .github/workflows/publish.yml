name: Publish npm

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Released source runs in an isolated build job with no shared cache access.
cache-mode: none

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  candidate:
    if: >-
      github.repository == 'yukiharada1228/langchainjs-postgres' &&
      vars.RELEASE_AUTOMATION_ENABLED == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Resolve a released, CI-verified commit that npm does not have
        id: release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { publishCandidate } = require('./.github/scripts/release-policy.cjs');
            const candidate = await publishCandidate({ github, context });
            core.setOutput('publish', Boolean(candidate && !candidate.published));
            if (candidate) {
              core.setOutput('sha', candidate.sha);
              core.setOutput('version', candidate.version);
              core.info(JSON.stringify(candidate));
            }

  build:
    needs: candidate
    if: needs.candidate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.candidate.outputs.version }}
          persist-credentials: false
      - name: Require the released tag to still point at the CI-verified commit
        env:
          RELEASE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run build
      - name: Pack the tested package
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
        run: node .github/scripts/npm-release.cjs pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release
          path: release-artifact/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [candidate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # Never install dependencies or run package lifecycle scripts with OIDC access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/actions
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: release-artifact
      - name: Publish with npm Trusted Publishing and verify registry integrity
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
        run: node .github/scripts/npm-release.cjs publish
